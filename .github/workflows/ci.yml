name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: iot_user
          POSTGRES_DB: iot_platform
          # Base efímera del job, solo accesible desde el runner: sin
          # contraseña. Ninguna credencial queda escrita en el repositorio.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Sin volúmenes: los servicios arrancan antes del checkout y montar el
        # workspace deja carpetas de root que hacen fallar actions/checkout.
        # El esquema se aplica más abajo con database/initdb/00-schema.sh.
        options: >-
          --health-cmd "pg_isready -U iot_user -d iot_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Credenciales de un solo uso para esta corrida, ocultas en los logs.
      # El backend exige DB_PASSWORD (no tiene valor por defecto); con la base
      # en modo trust cualquier valor es aceptado.
      - name: Generate ephemeral credentials
        run: |
          for name in DB_PASSWORD JWT_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Apply database schema and migrations
        env:
          AIRSUNBOX_DB_DIR: plataforma-iot-airsunbox/database
          PGHOST: 127.0.0.1
          PGPORT: 5432
          POSTGRES_USER: iot_user
          POSTGRES_DB: iot_platform
        run: sh plataforma-iot-airsunbox/database/initdb/00-schema.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plataforma-iot-airsunbox/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: plataforma-iot-airsunbox/backend
        run: npm ci

      - name: Typecheck backend
        working-directory: plataforma-iot-airsunbox/backend
        run: npm run typecheck

      - name: Build backend
        working-directory: plataforma-iot-airsunbox/backend
        run: npm run build

      - name: Run backend unit tests
        working-directory: plataforma-iot-airsunbox/backend
        run: npm test

      - name: Start backend for smoke tests
        working-directory: plataforma-iot-airsunbox/backend
        env:
          NODE_ENV: test
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: iot_user
          DB_NAME: iot_platform
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          MQTT_HOST: 127.0.0.1
          MQTT_PORT: 1883
        run: npm start > /tmp/airsunbox-backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/airsunbox-backend.log
          exit 1

      - name: Run backend smoke tests
        working-directory: plataforma-iot-airsunbox/backend
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: npm run test:smoke

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plataforma-iot-airsunbox/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: plataforma-iot-airsunbox/frontend
        run: npm ci

      - name: Build frontend
        working-directory: plataforma-iot-airsunbox/frontend
        run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: airsunbox-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy tested main commit through SSM
        env:
          DEPLOY_SHA: ${{ github.sha }}
          EC2_INSTANCE_ID: i-07a637df8369c3f6c
          AWS_REGION: us-east-2
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

          remote_command=$(cat <<EOF
          set -eu
          repo=/home/ubuntu/apps/airsunbox
          compose_dir=\$repo/plataforma-iot-airsunbox
          deploy_sha=$DEPLOY_SHA

          test "\$(sudo -u ubuntu -H git -C "\$repo" branch --show-current)" = main
          test -z "\$(sudo -u ubuntu -H git -C "\$repo" status --porcelain)"
          sudo -u ubuntu -H git -C "\$repo" fetch --no-tags origin main
          test "\$(sudo -u ubuntu -H git -C "\$repo" rev-parse refs/remotes/origin/main)" = "\$deploy_sha"
          sudo -u ubuntu -H git -C "\$repo" merge --ff-only "\$deploy_sha"

          cd "\$compose_dir"
          docker compose -p airsunbox -f docker-compose.yml build --quiet backend frontend
          docker compose -p airsunbox -f docker-compose.yml up -d --no-deps backend frontend

          for attempt in \$(seq 1 60); do
            backend_health=\$(docker inspect --format '{{.State.Health.Status}}' iot_backend 2>/dev/null || true)
            frontend_state=\$(docker inspect --format '{{.State.Status}}' iot_frontend 2>/dev/null || true)
            if [ "\$backend_health" = healthy ] && [ "\$frontend_state" = running ]; then
              break
            fi
            sleep 2
          done
          if [ "\$backend_health" != healthy ]; then
            echo "Backend health check failed: expected healthy, got \${backend_health:-unavailable}." >&2
            exit 1
          fi
          if [ "\$frontend_state" != running ]; then
            echo "Frontend health check failed: expected running, got \${frontend_state:-unavailable}." >&2
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null --resolve 18.223.121.208:443:127.0.0.1 https://18.223.121.208/
          printf 'DEPLOYED_SHA=%s\\n' "\$deploy_sha"
          docker compose -p airsunbox -f docker-compose.yml ps --format 'table {{.Service}} {{.State}} {{.Health}}'
          EOF
          )

          parameters=$(jq -cn --arg command "$remote_command" '{commands: [$command], executionTimeout: ["900"]}')
          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "AirSunBox deploy $DEPLOY_SHA" \
            --timeout-seconds 120 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          poll_error_file=$(mktemp)
          trap 'rm -f "$poll_error_file"' EXIT
          redact_ssm_output() {
            python3 -c 'import re,sys; s=sys.stdin.read(); s=re.sub(r"""(?im)(["\x27]?\w*(?:password|passwd|token|secret|api[_-]?key|access[_-]?key|credential|private[_-]?key|authorization)\w*["\x27]?\s*[:=]\s*)(?:"[^"]*"|\x27[^\x27]*\x27|[^\r\n]+)""", r"\1[REDACTED]", s); s=re.sub(r"(?i)(https?://)[^/@\s:]+:[^/@\s]+@", r"\1[REDACTED]@", s); s=re.sub(r"-----BEGIN [^-]*PRIVATE KEY-----.*?-----END [^-]*PRIVATE KEY-----", "[REDACTED PRIVATE KEY]", s, flags=re.S); s=re.sub(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b", "[REDACTED AWS KEY ID]", s); s=re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b", "[REDACTED TOKEN]", s); sys.stdout.write(s)'
          }
          for attempt in $(seq 1 240); do
            if status=$(aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query Status \
                --output text 2>"$poll_error_file"); then
              :
            elif grep -q 'InvocationDoesNotExist' "$poll_error_file" && [ "$attempt" -le 6 ]; then
              echo "SSM invocation is not visible yet; retrying ($attempt/6)." >&2
              sleep 5
              continue
            else
              echo "Unable to poll SSM command $command_id:" >&2
              cat "$poll_error_file" >&2
              exit 1
            fi

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform|AccessDenied|"Delivery Timed Out"|"Execution Timed Out"|"Invalid Platform"|"Access Denied")
                if details=$(aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{ResponseCode:ResponseCode,StandardErrorContent:StandardErrorContent,StandardOutputContent:StandardOutputContent}' \
                  --output json 2>"$poll_error_file"); then
                  response_code=$(jq -r '.ResponseCode // "unavailable"' <<< "$details")
                  echo "SSM deployment failed with status: $status (response code: $response_code)." >&2
                  for output_field in StandardErrorContent StandardOutputContent; do
                    output=$(jq -r --arg field "$output_field" '.[$field] // ""' <<< "$details")
                    if [ -n "$output" ]; then
                      echo "Remote $output_field (credential patterns redacted):" >&2
                      printf '%s\n' "$output" | redact_ssm_output >&2
                    else
                      echo "Remote $output_field: (empty)" >&2
                    fi
                  done
                else
                  echo "SSM deployment failed with status: $status; response details could not be retrieved." >&2
                  redact_ssm_output < "$poll_error_file" >&2
                fi
                exit 1
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                echo "SSM returned unexpected deployment status: $status" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for SSM deployment command $command_id" >&2
          exit 1
