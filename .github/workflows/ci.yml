name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: iot_user
          POSTGRES_PASSWORD: iot_password
          POSTGRES_DB: iot_platform
        ports:
          - 5432:5432
        volumes:
          - ${{ github.workspace }}/plataforma-iot-sanik/database:/sanik-db:ro
          - ${{ github.workspace }}/plataforma-iot-sanik/database/initdb:/docker-entrypoint-initdb.d:ro
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plataforma-iot-sanik/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: plataforma-iot-sanik/backend
        run: npm ci

      - name: Typecheck backend
        working-directory: plataforma-iot-sanik/backend
        run: npm run typecheck

      - name: Build backend
        working-directory: plataforma-iot-sanik/backend
        run: npm run build

      - name: Start backend for smoke tests
        working-directory: plataforma-iot-sanik/backend
        env:
          NODE_ENV: test
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: iot_user
          DB_PASSWORD: iot_password
          DB_NAME: iot_platform
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          MQTT_HOST: 127.0.0.1
          MQTT_PORT: 1883
        run: npm start > /tmp/sanik-backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sanik-backend.log
          exit 1

      - name: Run backend smoke tests
        working-directory: plataforma-iot-sanik/backend
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plataforma-iot-sanik/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: plataforma-iot-sanik/frontend
        run: npm ci

      - name: Build frontend
        working-directory: plataforma-iot-sanik/frontend
        run: npm run build
