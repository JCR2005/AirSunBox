
# HTTP: conservar el desafío ACME y redirigir el resto a HTTPS.
server {
  listen 80;
  server_name 18.223.121.208 _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://18.223.121.208$request_uri;
  }
}

# HTTPS: frontend, API y WebSockets.
server {
  listen 443 ssl;
  server_name 18.223.121.208 _;

  ssl_certificate /etc/letsencrypt/live/18.223.121.208-prod/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/18.223.121.208-prod/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # El HTML siempre se revalida para cargar los bundles nuevos.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
  }

  # Assets con hash: caché larga.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  location /ws {
    proxy_pass http://backend:3000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
