# Cabeceras de seguridad para todas las respuestas HTTPS.
# nginx no hereda add_header en un location que define los suyos, por eso
# este archivo se incluye en el server y en cada location con add_header.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
# Sin scripts ni estilos restringidos (mapas, fuentes y estilos en línea):
# solo se prohíbe embeber la página, los plugins y cambiar la base de URLs.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
